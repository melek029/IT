<!DOCTYPE html>
<html lang="en">
    <head>
         <title>home work</title>
         <meta charset="UTF-8">
         <meta name="viewport" content="width=device-width, initial-scale=1.0">
    </head>
    <body>
      <h3>Get started on Facebook with a Meta Account</h3>
      <p>A Meta Account lets you access multiple Meta services like Facebook,easily and securely.</p>
        <form action="">  
          <label for="user-name">Name</label>
        <br>
        <input type="text" id="user-name" placeholder=“Name”>
        <input type="text" placeholder=“Surname”>
        <br>
        <label for="date">Date of birth</label>
        <br>
        <input type="date" id="date">
        <br>
        <label for="gender">Gender</label>
        <br>
        <select id="gender">
          <option value="male">Male</option>
          <option value="female">Female</option>
          <option value="another">Another</option>
        </select>
        <br>
        <label for="address">Email address</label>
        <br>
        <input type="email" id="address">
        <br>
        <label for="pass">Password</label>
        <br>
        <input type="password" id="pass">
        <br>
        <button type="submit">Send</button>
      </form> 
    </body>
</html>
